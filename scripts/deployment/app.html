<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>CineMatch - Recomendador de Películas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #6a11cb;
            --secondary: #2575fc;
            --accent: #ff6b6b;
            --light: #f8f9fa;
            --dark: #212529;
        }
        
        body {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            min-height: 100vh;
            padding: 2rem;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .card {
            border-radius: 20px;
            border: none;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            background-color: rgba(255, 255, 255, 0.95);
        }
        
        .card-header {
            background: linear-gradient(to right, var(--primary), var(--secondary));
            color: white;
            font-weight: 700;
            padding: 1.5rem;
            border-radius: 0 !important;
        }
        
        .form-control, .form-select {
            border-radius: 10px;
            border: 1px solid #e0e0e0;
            padding: 0.75rem 1rem;
            transition: all 0.3s;
        }
        
        .form-control:focus, .form-select:focus {
            border-color: var(--secondary);
            box-shadow: 0 0 0 0.25rem rgba(37, 117, 252, 0.15);
        }
        
        .btn-predict {
            background: linear-gradient(to right, var(--primary), var(--secondary));
            border: none;
            border-radius: 10px;
            padding: 0.75rem;
            font-weight: 600;
            transition: all 0.3s;
            color: white;
        }
        
        .btn-predict:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(106, 17, 203, 0.4);
        }
        
        .genre-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.5rem;
        }
        
        .genre-item {
            background: #f1f3f5;
            border-radius: 8px;
            padding: 0.5rem;
            transition: all 0.2s;
        }
        
        .genre-item:hover {
            background: #e9ecef;
            transform: translateY(-2px);
        }
        
        .result-card {
            background: linear-gradient(to right, #20c997, #38d9a9);
            color: white;
            border-radius: 12px;
            padding: 1.5rem;
            text-align: center;
            font-weight: 600;
            font-size: 1.2rem;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.5s ease;
        }
        
        .result-card.show {
            opacity: 1;
            transform: translateY(0);
        }
        
        .input-group {
            margin-bottom: 1.5rem;
        }
        
        label {
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: var(--dark);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card">
                    <div class="card-header text-center">
                        <h2 class="mb-0"> Recomendador de Películas</h2>
                    </div>
                    
                    <div class="card-body p-4">
                        <div class="row g-4">
                            <!-- Numerical Inputs -->
                            <div class="col-md-6">
                                <div class="input-group">
                                    <label class="form-label">ID del usuario:</label>
                                    <input type="number" id="userId" class="form-control">
                                </div>
                                
                                <div class="input-group">
                                    <label class="form-label">Popularidad:</label>
                                    <input type="number" id="popularity" step="any" class="form-control">
                                </div>
                                
                                <div class="input-group">
                                    <label class="form-label">Promedio de votos:</label>
                                    <input type="number" id="vote_average" step="any" class="form-control">
                                </div>
                                
                                <div class="input-group">
                                    <label class="form-label">Cantidad de votos:</label>
                                    <input type="number" id="vote_count" class="form-control">
                                </div>
                            </div>
                            
                            <div class="col-md-6">
                                <div class="input-group">
                                    <label class="form-label">Duración (minutos):</label>
                                    <input type="number" id="runtime" class="form-control">
                                </div>
                                
                                <div class="input-group">
                                    <label class="form-label">Año:</label>
                                    <input type="number" id="year" class="form-control">
                                </div>
                                
                                <!-- Model Selection -->
                                <div class="input-group">
                                    <label class="form-label">Modelo a utilizar:</label>
                                    <select id="modelSelect" class="form-select">
                                        <option value="logistic_regression">Regresión Logística</option>
                                        <option value="random_forest">Random Forest</option>
                                        <option value="gradient_boosting">Gradient Boosting</option>
                                        <option value="svm_rbf">SVM RBF</option>
                                    </select>
                                </div>
                                
                                <!-- Prediction Button -->
                                <button id="predictBtn" class="btn btn-predict w-100 mt-3">
                                      Predecir
                                </button>
                            </div>
                        </div>
                        
                        <!-- Genres Section -->
                        <div class="input-group mt-3">
                            <label class="form-label">Géneros:</label>
                            <div class="genre-grid">
                                <div class="genre-item">
                                    <label><input type="checkbox" value="Action"> Acción</label>
                                </div>
                                <div class="genre-item">
                                    <label><input type="checkbox" value="Adventure"> Aventura</label>
                                </div>
                                <div class="genre-item">
                                    <label><input type="checkbox" value="Animation"> Animación</label>
                                </div>
                                <div class="genre-item">
                                    <label><input type="checkbox" value="Children"> Infantil</label>
                                </div>
                                <div class="genre-item">
                                    <label><input type="checkbox" value="Comedy"> Comedia</label>
                                </div>
                                <div class="genre-item">
                                    <label><input type="checkbox" value="Crime"> Crimen</label>
                                </div>
                                <div class="genre-item">
                                    <label><input type="checkbox" value="Documentary"> Documental</label>
                                </div>
                                <div class="genre-item">
                                    <label><input type="checkbox" value="Drama"> Drama</label>
                                </div>
                                <div class="genre-item">
                                    <label><input type="checkbox" value="Fantasy"> Fantasía</label>
                                </div>
                                <div class="genre-item">
                                    <label><input type="checkbox" value="Horror"> Terror</label>
                                </div>
                                <div class="genre-item">
                                    <label><input type="checkbox" value="Mystery"> Misterio</label>
                                </div>
                                <div class="genre-item">
                                    <label><input type="checkbox" value="Romance"> Romance</label>
                                </div>
                                <div class="genre-item">
                                    <label><input type="checkbox" value="Sci-Fi"> Ciencia Ficción</label>
                                </div>
                                <div class="genre-item">
                                    <label><input type="checkbox" value="Thriller"> Suspenso</label>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Prediction Result -->
                        <div id="resultCard" class="result-card mt-4">
                            <span id="resultText"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

<script>
    const predictBtn = document.getElementById("predictBtn");
    const resultCard = document.getElementById("resultCard");
    const resultText = document.getElementById("resultText");

    // ¡Ojo! Ordena los géneros EXACTAMENTE como en tu entrenamiento
    const genreList = [
        "Action",
        "Adventure",
        "Animation",
        "Children",
        "Comedy",
        "Crime",
        "Documentary",
        "Drama",
        "Fantasy",
        "Horror",
        "Mystery",
        "Romance",
        "Sci-Fi",
        "Thriller"
    ];

    predictBtn.addEventListener("click", async function() {
        // 1. Numéricas (6)
        const numericFeatures = [
            parseFloat(document.getElementById("popularity").value) || 0,
            parseFloat(document.getElementById("vote_average").value) || 0,
            parseInt(document.getElementById("vote_count").value) || 0,
            parseFloat(document.getElementById("runtime").value) || 0,
            parseInt(document.getElementById("year").value) || 0,
            parseInt(document.getElementById("userId").value) || 0,
        ];

        // 2. Géneros (en el mismo orden que genreList)
        const genres = genreList.map(genre => {
            const checkbox = document.querySelector(`#genres input[value="${genre}"]`);
            return checkbox && checkbox.checked ? 1 : 0;
        });

        // 3. Formar el vector de 20 características
        const features = [...numericFeatures, ...genres];

        // Depuración (puedes quitarlo después)
        console.log("Features enviados:", features);
        console.log("Cantidad de features:", features.length);

        // Validación recomendada
        if (features.length !== 20) {
            resultText.textContent = "Error: Deben enviarse 20 características exactas (ahora: " + features.length + ")";
            resultCard.style.background = "linear-gradient(to right, #ff6b6b, #ff8787)";
            resultCard.classList.add("show");
            return;
        }

        const payload = {
            features: features,
            model_name: document.getElementById("modelSelect").value
        };

        try {
            const response = await fetch("/predict/", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            const result = await response.json();

            if (response.ok) {
                resultText.textContent = result.prediction === 1
                    ? "¡Le va a gustar esta película! 😎🍿👍"
                    : "Probablemente no le gustará esta película. 😢👎";
                resultCard.style.background = "linear-gradient(to right, #20c997, #38d9a9)";
                resultCard.classList.add("show");
            } else {
                resultText.textContent = "Error: " + result.detail;
                resultCard.style.background = "linear-gradient(to right, #ff6b6b, #ff8787)";
                resultCard.classList.add("show");
            }
        } catch (error) {
            resultText.textContent = "Error de conexión: " + error.message;
            resultCard.style.background = "linear-gradient(to right, #ff6b6b, #ff8787)";
            resultCard.classList.add("show");
        }
    });
</script>

</body>
</html>
